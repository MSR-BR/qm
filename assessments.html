<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chapter assessments · QUANTUM</title>
  <meta name="description" content="Reviewed chapter assessments for the QUANTUM interactive Quantum Mechanics book.">
  <link rel="icon" type="image/svg+xml" href="assets/quantum-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/termo-auth.css?v=0714.3">
  <link rel="stylesheet" href="assets/qm-first-login-preferences.css?v=0925.1">
  <link rel="stylesheet" href="assets/qm-assessments.css?v=0925.1">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(','\\)']],
        displayMath: [['\\[','\\]']],
        packages: {'[+]': ['ams']}
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="assets/termo-auth.js?v=0910.3"></script>
  <script defer src="assets/qm-first-login-preferences.js?v=0925.1"></script>
  <script defer src="assets/qm-assessments.js?v=0925.1"></script>
</head>
<body>
  <a class="skip-link" href="#assessmentContent">Skip to assessment</a>
  <header class="assessment-header">
    <div class="assessment-header__inner">
      <a class="assessment-brand" href="index.html?view=journey" aria-label="Back to QUANTUM study journey">
        <img src="assets/quantum-logo.svg" alt="">
        <span>QUANTUM</span>
      </a>
      <a class="assessment-back" href="index.html?view=journey">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        Study journey
      </a>
    </div>
  </header>

  <main class="assessment-layout" id="assessmentContent">
    <section class="assessment-intro" aria-labelledby="assessmentTitle">
      <p class="assessment-kicker">Reviewed practice</p>
      <h1 id="assessmentTitle">Chapter assessments</h1>
      <p>Check your understanding of a reviewed chapter. This is a chapter assessment, not the Daily Challenge. Every question links back to its source section for guided review.</p>
      <div class="assessment-controls">
        <label for="chapter">Reviewed chapter</label>
        <div class="assessment-controls__row">
          <select id="chapter" name="chapter">
            <option value="01">Chapter 1</option>
            <option value="02">Chapter 2</option>
            <option value="03">Chapter 3</option>
            <option value="04">Chapter 4</option>
            <option value="05">Chapter 5</option>
            <option value="06">Chapter 6</option>
            <option value="07">Chapter 7</option>
          </select>
          <button class="assessment-button assessment-button--primary" id="load" type="button">
            <i class="fa-solid fa-play" aria-hidden="true"></i>
            Start assessment
          </button>
        </div>
      </div>
    </section>

    <p class="assessment-page-status" id="pageStatus" role="status" aria-live="polite"></p>
    <section id="content" aria-live="off"></section>
  </main>

  <footer class="assessment-footer">
    <a href="index.html?view=chapters">Chapters</a>
    <span aria-hidden="true">•</span>
    <a href="index.html?view=preferences">Privacy and communication</a>
    <span aria-hidden="true">•</span>
    <a href="mailto:marioreis@id.uff.br">Support</a>
  </footer>
</body>
</html>
