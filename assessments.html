<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter assessments · Quantum Mechanics</title><link rel="stylesheet" href="assets/ai-exercises.css"><script src="assets/termo-auth.js"></script></head><body><main class="termo-exercise" style="max-width:900px;margin:40px auto;padding:24px" id="app"><h1>Chapter assessments</h1><p>Choose a reviewed chapter. Questions are linked to the relevant course page. Report any possible issue after submitting.</p><select id="chapter"><option value="01">Chapter 1</option><option value="02">Chapter 2</option><option value="03">Chapter 3</option><option value="04">Chapter 4</option><option value="05">Chapter 5</option><option value="06">Chapter 6</option><option value="07">Chapter 7</option></select> <button id="load">Start assessment</button><div id="content"></div></main><script>const c=document.querySelector('#content'),sel=document.querySelector('#chapter');let quiz,result;async function reportQuiz(){let session=await window.TermoAuth?.getSession?.();if(!session?.access_token)return document.querySelector('#reportStatus').textContent='Please sign in first.';let statement=quiz.questions.map(q=>q.prompt+' '+Object.entries(q.options).map(([k,v])=>k+') '+v).join(' ')).join('\n');let solution=result.feedback.map(f=>f.explanation+' Review: '+f.reviewTitle).join('\n');let r=await fetch('/api/exercicio-validacao',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({chapterId:quiz.chapterId,itemId:'assessment',pagePath:'assessments.html',pageUrl:'assessments.html',pageTitle:quiz.title,pageContent:quiz.title,difficulty:'medium',exerciseId:quiz.quizKey,exerciseTitle:quiz.title,statement,solution,statementStatus:'sim',solutionStatus:'nao_sei',statementNote:'Possible issue reported from chapter assessment.',solutionNote:'',language:'en'})});let p=await r.json();document.querySelector('#reportStatus').textContent=p.summary||p.error||'Report sent.';}function e(x){return String(x).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}async function load(){let r=await fetch('/api/qm-chapter-quiz',{method:'GET',headers:{'Content-Type':'application/json'},body:undefined});if(!r.ok){c.textContent='Assessment service is unavailable.';return}let d=await r.json();quiz=d.quiz;c.innerHTML='<h2>'+e(quiz.title)+'</h2><form id="f">'+quiz.questions.map((q,i)=>'<fieldset><legend>'+ (i+1)+'. '+e(q.prompt)+'</legend>'+Object.entries(q.options).map(([k,v])=>'<label><input required type="radio" name="'+q.questionId+'" value="'+k+'"> '+k.toUpperCase()+'. '+e(v)+'</label><br>').join('')+'</fieldset>').join('')+'<button>Submit assessment</button></form>';document.querySelector('#f').onsubmit=submit}async function submit(ev){ev.preventDefault();let session=await window.TermoAuth?.getSession?.();if(!session?.access_token){c.insertAdjacentHTML('beforeend','<p>Please sign in with Google before submitting.</p>');return}let answers=quiz.questions.map(q=>({questionId:q.questionId,choice:new FormData(ev.target).get(q.questionId)}));let r=await fetch('/api/qm-chapter-quiz',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({chapterId:quiz.chapterId,answers})});let d=await r.json();if(!r.ok){c.insertAdjacentHTML('beforeend','<p>'+e(d.error||'Could not submit.')+'</p>');return}result=d.result;c.innerHTML='<h2>'+d.result.score+'%</h2>'+d.result.feedback.map(x=>'<p>'+ (x.correct?'Correct.':'Review: <a href="'+e(x.reviewPath)+'">'+e(x.reviewTitle)+'</a>')+'</p>').join('')+'<details><summary>Report a possible assessment error</summary><p>Use the existing private professor-review queue.</p><button id=\"report\">Report this assessment</button><span id=\"reportStatus\"></span></details>';document.querySelector('#report').onclick=reportQuiz}document.querySelector('#load').onclick=async()=>{let r=await fetch('/api/qm-chapter-quiz?chapterId='+sel.value);let d=await r.json();quiz=d.quiz;c.innerHTML='<h2>'+e(quiz.title)+'</h2><form id="f">'+quiz.questions.map((q,i)=>'<fieldset><legend>'+ (i+1)+'. '+e(q.prompt)+'</legend>'+Object.entries(q.options).map(([k,v])=>'<label><input required type="radio" name="'+q.questionId+'" value="'+k+'"> '+k.toUpperCase()+'. '+e(v)+'</label><br>').join('')+'</fieldset>').join('')+'<button>Submit assessment</button></form>';document.querySelector('#f').onsubmit=submit};</script></body></html>
